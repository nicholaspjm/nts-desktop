productName: NTS Desktop
appId: "com.nicholaspjm.nts-desktop"

directories:
  app: dist
  output: bundle

# Apple Silicon will not run an unsigned arm64 binary. There is no certificate
# here, so the app is ad-hoc signed after packing instead.
afterPack: scripts/adhoc-sign.cjs

mac:
  icon: app/icon.icns
  category: public.app-category.music
  artifactName: "NTS-Desktop-${version}-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        # Both Apple Silicon and Intel, so one download covers any Mac.
        - arm64
        - x64

win:
  icon: logos/logo.png
  artifactName: "NTS-Desktop-${version}-Windows.${ext}"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # A per-user install needs no admin rights, and letting the user pick the
  # directory avoids silently reinstalling somewhere unexpected.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NTS Desktop

fileAssociations:
  ext: webloc
  role: Viewer
