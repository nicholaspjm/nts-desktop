productName: NTS Desktop
appId: "com.nicholaspjm.nts-desktop"

directories:
  app: dist
  output: bundle

# Apple Silicon will not run an unsigned arm64 binary, so when no certificate is
# available the app is ad-hoc signed after packing. When one IS available this
# stands aside and electron-builder signs properly, then the app is notarised.
# Both hooks no-op without credentials, so building from source still works.
afterPack: scripts/adhoc-sign.cjs
afterSign: scripts/notarize.cjs

mac:
  icon: app/icon.icns
  # Notarisation requires the hardened runtime. The entitlements give back only
  # what Electron cannot run without, and are ignored when signing ad-hoc.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The build machine assessing its own unnotarised output proves nothing, and
  # fails the build before notarisation has had a chance to run.
  gatekeeperAssess: false
  # electron-builder 24 auto-notarises the moment it sees the APPLE_API_* env
  # vars, using its own pinned copy of @electron/notarize. That copy calls
  # JSON.parse on notarytool's output unconditionally, so any plain-text error
  # from Apple surfaces as "Unexpected token" with the real message destroyed.
  # Turning it off leaves scripts/notarize.cjs as the single path, on a version
  # that reports what Apple actually said.
  notarize: false
  category: public.app-category.music
  artifactName: "NTS-Desktop-${version}-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        # Both Apple Silicon and Intel, so one download covers any Mac.
        - arm64
        - x64

win:
  icon: logos/logo.png
  artifactName: "NTS-Desktop-${version}-Windows.${ext}"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # A per-user install needs no admin rights, and letting the user pick the
  # directory avoids silently reinstalling somewhere unexpected.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NTS Desktop

fileAssociations:
  ext: webloc
  role: Viewer
