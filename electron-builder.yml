productName: NTS Desktop
appId: "com.nicholaspjm.nts-desktop"

directories:
  app: dist
  output: bundle

mac:
  icon: app/icon.icns
  category: public.app-category.music
  target:
    - target: dmg
      arch:
        # Both Apple Silicon and Intel, so one download covers any Mac.
        - arm64
        - x64

win:
  icon: logos/logo.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # A per-user install needs no admin rights, and letting the user pick the
  # directory avoids silently reinstalling somewhere unexpected.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NTS Desktop

fileAssociations:
  ext: webloc
  role: Viewer
