productName: NTS Desktop
appId: "com.nicholaspjm.nts-desktop"

directories:
  app: dist
  output: bundle

mac:
  icon: app/icon.icns
  category: public.app-category.music
  # No certificate, so no real signature. null makes electron-builder apply an
  # ad-hoc one, which Apple Silicon requires: an arm64 binary with no signature
  # at all is refused outright and reported as "damaged".
  identity: null
  artifactName: "NTS-Desktop-${version}-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        # Both Apple Silicon and Intel, so one download covers any Mac.
        - arm64
        - x64

win:
  icon: logos/logo.png
  artifactName: "NTS-Desktop-${version}-Windows.${ext}"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # A per-user install needs no admin rights, and letting the user pick the
  # directory avoids silently reinstalling somewhere unexpected.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NTS Desktop

fileAssociations:
  ext: webloc
  role: Viewer
