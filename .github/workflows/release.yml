name: Release

# Building the macOS app needs a Mac, so it happens here rather than on whatever
# machine is to hand. Push a tag like v0.3.0 and this attaches installers for
# both platforms to the release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not deny the other its installer.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            artifact: mac
          - os: windows-latest
            args: --win
            artifact: win

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read .tool-versions
        id: versions
        uses: marocchino/tool-versions-action@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.versions.outputs.pnpm }}

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}

      # Not --frozen-lockfile: the lockfile records this project's own platform
      # binaries, and each runner needs to resolve its own.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build renderer
        run: pnpm run build

      # Scoped to macOS on purpose: CSC_LINK is also what electron-builder reads
      # for Windows signing, and handing a Mac certificate to the Windows build
      # would fail it. Every value is optional, and the build falls back to an
      # ad-hoc signature when they are absent, so a fork with no secrets set
      # still produces working installers.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CERT" ]; then
            echo "CSC_LINK=$CERT" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "certificate configured, the app will be signed with it"
          else
            echo "no certificate configured, the app will be ad-hoc signed"
          fi

          if [ -z "$API_KEY" ]; then
            echo "no notarisation key configured, macOS will warn on first launch"
            exit 0
          fi

          # notarytool wants a file, not the key itself.
          mkdir -p "$HOME/private_keys"
          echo "$API_KEY" | base64 --decode > "$HOME/private_keys/AuthKey.p8"

          # Rules out a mangled secret before blaming the issuer for a failure.
          if ! grep -q "BEGIN PRIVATE KEY" "$HOME/private_keys/AuthKey.p8"; then
            echo "::warning::APPLE_API_KEY did not decode to a PEM private key. Check that the secret holds the base64 of the .p8 file."
          fi

          # Apple issues two kinds of App Store Connect key and they authenticate
          # differently. A Team key carries an issuer UUID; an Individual key has
          # none at all, and passing one is a hard error rather than an ignored
          # extra. Storing the credentials in a keychain profile covers both, and
          # rejects bad credentials here instead of after packaging.
          # A length is not the secret, so it survives log masking, and it is
          # enough to tell a UUID (36) from a Team ID (10) from an empty paste.
          echo "issuer secret is ${#API_ISSUER} characters long"

          if printf '%s' "$API_ISSUER" | grep -Eqi '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "issuer is a UUID, authenticating as a Team key"
            set -- --issuer "$API_ISSUER"
          else
            echo "issuer is absent or not a UUID, authenticating as an Individual key"
            set --
          fi

          # store-credentials PROMPTS for a missing issuer rather than inferring
          # there is none, and a runner has no keyboard, so it exhausts its
          # retries and fails. A bare echo sends the empty line it asks for, which
          # is how you say "Individual key". Harmless when --issuer was passed:
          # nothing is waiting to read it.
          if echo | xcrun notarytool store-credentials "nts-desktop" --key "$HOME/private_keys/AuthKey.p8" --key-id "$API_KEY_ID" "$@" 2>&1
          then
            echo "APPLE_KEYCHAIN_PROFILE=nts-desktop" >> "$GITHUB_ENV"
            echo "notarisation credentials accepted"
          else
            echo "::warning::Apple rejected the notarisation credentials, so the app is signed but NOT notarised and macOS will still warn on first launch. APPLE_API_ISSUER is ${#API_ISSUER} characters. The Issuer ID is a 36-character UUID, found above the key table at App Store Connect, Users and Access, Integrations. Ten characters usually means a Team ID or Key ID was pasted instead."
          fi

      # The Windows build is still unsigned: that needs a separate certificate,
      # and the README explains the SmartScreen warning it produces.
      - name: Build installer
        run: pnpm exec electron-builder build ${{ matrix.args }} --publish=never

      # Proves what was actually built rather than trusting the steps above. A
      # signed-but-unnotarised app looks identical here and warns on first launch
      # on the user's machine, so the difference is worth asking about out loud.
      - name: Verify the signature
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          # mac*/ rather than mac-*/: electron-builder writes arm64 to
          # bundle/mac-arm64 but x64 to plain bundle/mac, so the narrower glob
          # checked only half of what shipped and said nothing about the rest.
          found=0
          for app in bundle/mac*/*.app; do
            [ -e "$app" ] || continue
            found=$((found + 1))
            echo "=== $app ==="
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags" || true
            echo "--- notarisation ticket ---"
            xcrun stapler validate "$app" 2>&1 | tail -2 || true
            echo "--- Gatekeeper verdict ---"
            spctl -a -vvv -t install "$app" 2>&1 | tail -3 || true
          done

          # A glob that matches nothing looks exactly like a clean pass here.
          if [ "$found" -eq 0 ]; then
            echo "::warning::No .app was found to verify, so nothing above proves what shipped."
          else
            echo "verified $found app bundle(s)"
          fi

      # arm64 and x64 mean nothing to most people downloading this.
      - name: Give the installers readable names
        shell: bash
        run: |
          cd bundle
          for f in *-mac-arm64.dmg; do
            [ -e "$f" ] && mv "$f" "NTS-Desktop-Mac-Apple-Silicon.dmg"
          done
          for f in *-mac-x64.dmg; do
            [ -e "$f" ] && mv "$f" "NTS-Desktop-Mac-Intel.dmg"
          done
          for f in *-Windows.exe; do
            [ -e "$f" ] && mv "$f" "NTS-Desktop-Windows.exe"
          done
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: |
            bundle/*.exe
            bundle/*.dmg
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Attach
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          fail_on_unmatched_files: true
