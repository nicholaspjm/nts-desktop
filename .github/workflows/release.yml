name: Release

# Building the macOS app needs a Mac, so it happens here rather than on whatever
# machine is to hand. Push a tag like v0.3.0 and this attaches installers for
# both platforms to the release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not deny the other its installer.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            artifact: mac
          - os: windows-latest
            args: --win
            artifact: win

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read .tool-versions
        id: versions
        uses: marocchino/tool-versions-action@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.versions.outputs.pnpm }}

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}

      # Not --frozen-lockfile: the lockfile records this project's own platform
      # binaries, and each runner needs to resolve its own.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build renderer
        run: pnpm run build

      # Scoped to macOS on purpose: CSC_LINK is also what electron-builder reads
      # for Windows signing, and handing a Mac certificate to the Windows build
      # would fail it. Every value is optional, and the build falls back to an
      # ad-hoc signature when they are absent, so a fork with no secrets set
      # still produces working installers.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CERT" ]; then
            echo "CSC_LINK=$CERT" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "certificate configured, the app will be signed with it"
          else
            echo "no certificate configured, the app will be ad-hoc signed"
          fi

          if [ -n "$API_KEY" ]; then
            # notarytool wants a file, not the key itself.
            mkdir -p "$HOME/private_keys"
            echo "$API_KEY" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
            echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
            echo "notarisation key configured"
          else
            echo "no notarisation key configured, macOS will warn on first launch"
          fi

      # Asks Apple whether the credentials work at all, before spending ten
      # minutes packaging something that cannot be notarised. notarytool reports
      # credential problems in plain English, where the packaging path buries
      # them. Never fails the build: it is a diagnostic, not a gate.
      - name: Check notarisation credentials
        if: runner.os == 'macOS' && env.APPLE_API_KEY != ''
        continue-on-error: true
        shell: bash
        run: |
          xcrun notarytool history             --key "$APPLE_API_KEY"             --key-id "$APPLE_API_KEY_ID"             --issuer "$APPLE_API_ISSUER" 2>&1 | head -20

      # The Windows build is still unsigned: that needs a separate certificate,
      # and the README explains the SmartScreen warning it produces.
      - name: Build installer
        run: pnpm exec electron-builder build ${{ matrix.args }} --publish=never

      # arm64 and x64 mean nothing to most people downloading this.
      - name: Give the installers readable names
        shell: bash
        run: |
          cd bundle
          for f in *-mac-arm64.dmg; do
            [ -e "$f" ] && mv "$f" "NTS-Desktop-Mac-Apple-Silicon.dmg"
          done
          for f in *-mac-x64.dmg; do
            [ -e "$f" ] && mv "$f" "NTS-Desktop-Mac-Intel.dmg"
          done
          for f in *-Windows.exe; do
            [ -e "$f" ] && mv "$f" "NTS-Desktop-Windows.exe"
          done
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: |
            bundle/*.exe
            bundle/*.dmg
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Attach
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          fail_on_unmatched_files: true
