name: Release

# Building the macOS app needs a Mac, so it happens here rather than on whatever
# machine is to hand. Push a tag like v0.3.0 and this attaches installers for
# both platforms to the release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not deny the other its installer.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            artifact: mac
          - os: windows-latest
            args: --win
            artifact: win

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read .tool-versions
        id: versions
        uses: marocchino/tool-versions-action@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.versions.outputs.pnpm }}

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}

      # Not --frozen-lockfile: the lockfile records this project's own platform
      # binaries, and each runner needs to resolve its own.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build renderer
        run: pnpm run build

      # Unsigned on purpose. Signing needs a paid certificate on both platforms,
      # and the README explains how to get past the resulting warnings.
      - name: Build installer
        run: pnpm exec electron-builder build ${{ matrix.args }} --publish=never

      # arm64 and x64 mean nothing to most people downloading this.
      - name: Give the installers readable names
        shell: bash
        run: |
          cd bundle
          for f in *-mac-arm64.dmg; do
            [ -e "$f" ] && mv "$f" "NTS-Desktop-Mac-Apple-Silicon.dmg"
          done
          for f in *-mac-x64.dmg; do
            [ -e "$f" ] && mv "$f" "NTS-Desktop-Mac-Intel.dmg"
          done
          for f in *-Windows.exe; do
            [ -e "$f" ] && mv "$f" "NTS-Desktop-Windows.exe"
          done
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: |
            bundle/*.exe
            bundle/*.dmg
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Attach
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          fail_on_unmatched_files: true
