name: CI
on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read .tool-versions
        id: versions
        uses: marocchino/tool-versions-action@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.versions.outputs.pnpm }}

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Formatting
        run: pnpm run format:check

      # Proves the renderer and main process actually build. The Windows
      # installer is not built here: electron-builder needs a Windows runner and
      # the release is published manually.
      - name: Build
        run: pnpm run build
